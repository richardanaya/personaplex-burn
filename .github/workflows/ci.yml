name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: audio headers for the cpal adapter
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --features "flex,realtime-server" -- -D warnings
      - name: flex parity tests
        run: cargo test -p personaplex-burn --no-default-features --features flex
      - name: realtime protocol tests
        run: 'cargo test -p personaplex-burn --features realtime-server --lib realtime::'
      - name: realtime web example
        run: cargo build --example realtime_web --features realtime-server
      - name: workspace build
        run: cargo build --workspace --features realtime-server

[workspace]
members = [".", "adapters/batch", "adapters/talk", "adapters/server"]
resolver = "2"

[package]
name = "personaplex-burn"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "NVIDIA PersonaPlex full-duplex speech-to-speech on Burn"
readme = "README.md"
authors = ["personaplex-burn contributors"]
autobins = false
autoexamples = false

[[bin]]
name = "personaplex-realtime"
path = "src/bin/realtime.rs"
required-features = ["realtime-server"]

[[example]]
name = "realtime_web"
path = "examples/realtime_web/main.rs"
required-features = ["realtime-server"]

[[example]]
name = "smoke_load"
path = "examples/smoke_load.rs"

[features]
## Inference backend. Burn's wgpu runtime (Vulkan, Metal, DX12, OpenGL, WebGPU).
default = ["wgpu"]
## Pure-Rust CPU backend (Burn Flex). Parity tests only. Burn 0.22 deprecates NdArray.
flex = ["burn/flex"]
## Alias for the test CPU backend.
cpu = ["flex"]
## GPU inference through wgpu. This is the default and the only backend the
## session, TUI, realtime server, and web example use.
wgpu = ["burn/wgpu"]
## Pin an adapter to the browser WebGPU API (`Device::webgpu`). Desktop and
## server inference uses [`Device::wgpu`](https://docs.rs/burn/latest/burn/tensor/struct.Device.html)
## instead, which still goes through wgpu and obeys the same buffer limits.
webgpu = ["wgpu", "burn/webgpu"]
## OpenAI Realtime / xAI Voice WebSocket server (`personaplex-realtime`
## and the `realtime_web` example).
## Off by default so the library does not depend on tokio.
realtime-server = [
    "wgpu",
    "dep:base64",
    "dep:clap",
    "dep:futures-util",
    "dep:tokio",
    "dep:tokio-tungstenite",
]

[dependencies]
burn = { version = "0.22", default-features = false, features = ["std"] }
ebur128 = "0.1"
half = "2"
hound = "3.5"
memmap2 = "0.9"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "rustls-tls"] }
base64 = { version = "0.22", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
futures-util = { version = "0.3", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-tungstenite = { version = "0.26", optional = true }

[dev-dependencies]
serde_json = "1"
